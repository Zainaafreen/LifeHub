<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeHub – Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-wrapper">
  <button class="nav-toggle" id="nav-toggle">☰</button>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">LifeHub</div>
      <div class="logo-sub">Personal Dashboard</div>
    </div>
    <span class="nav-section-label">Overview</span>
    <a href="/index.html"           class="nav-link"><span class="nav-icon">🏠</span> Dashboard</a>
    <span class="nav-section-label">Manage</span>
    <a href="/pages/tasks.html"     class="nav-link active"><span class="nav-icon">✅</span> Tasks</a>
    <a href="/pages/expenses.html"  class="nav-link"><span class="nav-icon">💰</span> Expenses</a>
    <a href="/pages/health.html"    class="nav-link"><span class="nav-icon">❤️</span> Health</a>
    <a href="/pages/reminders.html" class="nav-link"><span class="nav-icon">🔔</span> Reminders</a>
    <div class="sidebar-footer">
      <a href="/pages/profile.html" class="sidebar-user sidebar-user-link" title="Edit profile" style="text-decoration:none;cursor:pointer;">
        <div class="sidebar-avatar" id="sidebar-avatar">U</div>
        <div style="min-width:0;">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading…</div>
          <div class="sidebar-user-email" id="sidebar-user-email">&nbsp;</div>
        </div>
      </a>
      <button class="btn btn-outline w-full" id="logout-btn">Sign out</button>
    </div>
  </nav>

  <main class="main-content">
    <div class="page-header flex items-center justify-between">
      <div>
        <h1>Tasks</h1>
        <p id="today-date"></p>
      </div>
      <button class="btn btn-primary" id="add-task-btn">+ Add Task</button>
    </div>

    <!-- Fix #3: 4 stat cards including High Priority counter -->
    <div class="stats-grid" style="margin-bottom:24px">
      <div class="stat-card peach">
        <div class="stat-icon">📋</div>
        <div class="stat-info">
          <div class="stat-label">Total</div>
          <div class="stat-value" id="tstat-total">—</div>
        </div>
      </div>
      <div class="stat-card mint">
        <div class="stat-icon">✅</div>
        <div class="stat-info">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="tstat-completed">—</div>
        </div>
      </div>
      <div class="stat-card lavender">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <div class="stat-label">Pending</div>
          <div class="stat-value" id="tstat-pending">—</div>
        </div>
      </div>
      <div class="stat-card rose">
        <div class="stat-icon">🔴</div>
        <div class="stat-info">
          <div class="stat-label">High Priority</div>
          <div class="stat-value" id="tstat-high">—</div>
        </div>
      </div>
    </div>

    <!-- Fix #3: dual filter — status + priority -->
    <div class="card">
      <div class="flex items-center justify-between mb-3" style="flex-wrap:wrap;gap:10px">
        <h2 class="card-title" style="margin-bottom:0">All Tasks</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select class="form-input" id="task-filter" style="width:auto;padding:6px 12px">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
          <select class="form-input" id="priority-filter" style="width:auto;padding:6px 12px">
            <option value="all">All Priorities</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
      </div>
      <div id="tasks-list"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<!-- Add Task Modal — Fix #3: includes priority selector -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">New Task</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <form id="task-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="task-title">Task title</label>
        <input class="form-input" type="text" id="task-title" placeholder="e.g. Buy groceries" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="task-priority">Priority</label>
        <select class="form-input" id="task-priority">
          <option value="medium" selected>🟡 Medium</option>
          <option value="high">🔴 High</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Task Modal — Fix #3: includes priority selector -->
<div class="modal-overlay" id="edit-task-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit Task</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <form id="edit-task-form" novalidate>
      <input type="hidden" id="edit-task-id" />
      <div class="form-group">
        <label class="form-label" for="edit-task-title">Task title</label>
        <input class="form-input" type="text" id="edit-task-title" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-task-priority">Priority</label>
        <select class="form-input" id="edit-task-priority">
          <option value="medium">🟡 Medium</option>
          <option value="high">🔴 High</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/tasks.js"></script>
</body>
</html>
