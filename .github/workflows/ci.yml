name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Lint + Test ────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-do-not-use-in-production-1234567890ab
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lifehub_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Apply database schema
        run: psql "$DATABASE_URL" -f schema.sql

      - name: Run pending migrations
        working-directory: backend
        run: npm run migrate

      - name: Run tests
        working-directory: backend
        run: npm test

  # ── 2. Deploy to Render ───────────────────────────────────────────────────────
  # Only runs on pushes to main/master (not on pull requests).
  # Required repository secrets:
  #   RENDER_API_KEY    — from https://dashboard.render.com/u/settings → API Keys
  #   RENDER_SERVICE_ID — the srv-xxxx ID shown in your Render service URL
  #
  # Deploying to Railway instead? Replace with:
  #   uses: railwayapp/deploy-action@v1
  #   with: { service: ${{ secrets.RAILWAY_SERVICE_ID }}, token: ${{ secrets.RAILWAY_TOKEN }} }
  #
  # Deploying to Fly.io instead? Replace with:
  #   uses: superfly/flyctl-actions/setup-flyctl@master  +  flyctl deploy --remote-only
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Render deploy
        run: |
          curl --silent --show-error --fail \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
